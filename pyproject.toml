[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc"
version = "0.1.0"
description = "Minimal Anthropic proxy with automatic provider fallback"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
ccc = "ccc.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccc*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
